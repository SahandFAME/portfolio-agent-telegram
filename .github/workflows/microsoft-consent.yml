name: Authorize Microsoft access
on:
  workflow_dispatch:
    inputs:
      client_id:
        description: Optional override; leave empty to use the app assigned to the selected purpose
        required: false
        type: string
        default: ''
      purpose:
        description: Read-only workbook sync or separate OneDrive report export
        type: choice
        options: [read_only, report_export]
        default: read_only
      signin_public_key:
        description: Codex-generated public encryption key for private report-export sign-in
        required: false
        type: string
permissions:
  contents: read
  checks: write
concurrency:
  group: ${{ inputs.purpose == 'report_export' && 'onedrive-report-export' || 'microsoft-consent' }}
  cancel-in-progress: false
jobs:
  consent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MS_GRAPH_CLIENT_ID: ${{ inputs.client_id || (inputs.purpose == 'report_export' && '04a73ec3-340a-4cb6-a087-7fdc4dfd93e0' || 'dbff9cdd-2ee1-489b-ac50-71a2021b18e2') }}
      MICROSOFT_CONSENT_PURPOSE: ${{ inputs.purpose || 'read_only' }}
      MICROSOFT_SIGNIN_PUBLIC_KEY: ${{ inputs.signin_public_key }}
      CONSENT_CHECK_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ secrets.PORTFOLIO_SECRET_WRITER_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate actual GitHub credential, then complete Microsoft sign-in
        run: |
          python -m unittest discover -s tests -p 'test_microsoft_consent.py' -v
          python -u scripts/authorize_microsoft.py
