name: Audit gold history inputs (read only)
on:
  workflow_dispatch:
    inputs:
      diagnostic_certificate:
        description: Optional public encryption certificate for private total-cell inspection
        required: false
        type: string
permissions:
  contents: read
  checks: write
concurrency:
  group: microsoft-consent
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove temporary detailed check diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import json,os,subprocess
          # Only the creating GitHub Actions app may edit its old check output.
          for sha in ['f3014d2085f41fab6ab8887c359763d670e33799','15e3b161a6531d59cfe2b69fef8c60e8dcd437eb']:
              r=subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{sha}/check-runs"],capture_output=True,text=True,check=True)
              for check in json.loads(r.stdout)['check_runs']:
                  if check['name']=='Portfolio history schema audit':
                      output={'output':{'title':'Read-only audit completed','summary':'Detailed temporary diagnostics removed. Future diagnostics are aggregate-only; the source workbook and history report remain private.'}}
                      fixed=subprocess.run(['gh','api','--method','PATCH',f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs/{check['id']}",'--input','-'],input=json.dumps(output),capture_output=True,text=True)
                      if fixed.returncode:raise SystemExit('Unable to remove temporary check diagnostics')
          PYTHON
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-sync.txt
      - name: Inspect historical table/date coverage, never values
        if: inputs.diagnostic_certificate == ''
        env:
          MS_GRAPH_CLIENT_ID: 04a73ec3-340a-4cb6-a087-7fdc4dfd93e0
          MS_GRAPH_TENANT_ID: consumers
          MS_GRAPH_AUTH_MODE: delegated
          MS_GRAPH_DRIVE_ID: daef687b3c624f3
          MS_GRAPH_ITEM_ID: DAEF687B3C624F3!2063
          MS_GRAPH_REFRESH_TOKEN: ${{ secrets.MS_GRAPH_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.PORTFOLIO_SECRET_WRITER_TOKEN }}
        run: python scripts/audit_history_inputs.py > history-audit-result.json
      - name: Inspect requested total formula privately
        if: inputs.diagnostic_certificate != ''
        env:
          DIAGNOSTIC_CERTIFICATE: ${{ inputs.diagnostic_certificate }}
          MS_GRAPH_CLIENT_ID: 04a73ec3-340a-4cb6-a087-7fdc4dfd93e0
          MS_GRAPH_TENANT_ID: consumers
          MS_GRAPH_AUTH_MODE: delegated
          MS_GRAPH_DRIVE_ID: daef687b3c624f3
          MS_GRAPH_ITEM_ID: DAEF687B3C624F3!2063
          MS_GRAPH_REFRESH_TOKEN: ${{ secrets.MS_GRAPH_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.PORTFOLIO_SECRET_WRITER_TOKEN }}
          PRIVATE_AUDIT_CHECK_TOKEN: ${{ github.token }}
        run: python scripts/inspect_tether_total.py
      - name: Publish schema-only diagnostic for private review
        if: inputs.diagnostic_certificate == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import json,os,subprocess
          from pathlib import Path
          result=json.loads(Path('history-audit-result.json').read_text())
          body={'name':'Portfolio history schema audit','head_sha':os.environ['GITHUB_SHA'],'status':'completed','conclusion':'success',
            'output':{'title':'Read-only schema and coverage (no holdings or credentials)','summary':json.dumps({key:result[key] for key in ['ok','configured_tables','unconfigured_table_count','reconciliation_failures']})}}
          p=subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",'--input','-'],
            input=json.dumps(body),text=True,capture_output=True)
          if p.returncode: raise SystemExit('Unable to publish schema audit')
          PYTHON
