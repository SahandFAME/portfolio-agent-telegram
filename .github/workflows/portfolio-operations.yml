name: Portfolio operations (manual until approved migration)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Read-only checks by default; write requires protected environment approval
        default: compare
        options: [compare, monitor, telegram, write]
# Intentionally no schedule. Add only after independent consent, live comparison,
# staging verification, and the owner's approval. 09:00 Tehran is 05:30 UTC:
# schedule:
#   - cron: '30 5 * * *'
# GitHub scheduling may be delayed; an hourly monitor needs a separate schedule.
permissions:
  contents: read
concurrency:
  group: portfolio-operations
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.operation == 'write' && 'portfolio-production' || 'portfolio-readonly' }}
    env:
      PORTFOLIO_ENDPOINT: ${{ vars.PORTFOLIO_ENDPOINT }}
      PORTFOLIO_MIGRATION_APPROVED: ${{ vars.PORTFOLIO_MIGRATION_APPROVED }}
      PORTFOLIO_SYNC_SECRET_AGENT: ${{ secrets.PORTFOLIO_SYNC_SECRET_AGENT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      MS_GRAPH_AUTH_MODE: delegated
      MS_GRAPH_TENANT_ID: consumers
      MS_GRAPH_CLIENT_ID: ${{ vars.MS_GRAPH_CLIENT_ID }}
      MS_GRAPH_DRIVE_ID: ${{ vars.MS_GRAPH_DRIVE_ID }}
      MS_GRAPH_ITEM_ID: ${{ vars.MS_GRAPH_ITEM_ID }}
      MS_GRAPH_REFRESH_TOKEN: ${{ secrets.MS_GRAPH_REFRESH_TOKEN }}
      MS_GRAPH_CLIENT_SECRET: ${{ secrets.MS_GRAPH_CLIENT_SECRET }}
      # Fine-grained credential restricted to this repo, Secrets: write.
      # Needed to persist rotated OAuth refresh tokens; GITHUB_TOKEN cannot do it.
      GH_TOKEN: ${{ secrets.PORTFOLIO_SECRET_WRITER_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-sync.txt
      - name: Compare live workbook totals with production (read-only)
        if: inputs.operation == 'compare'
        run: python scripts/portfolio_sync.py
      - name: Verify health and snapshot freshness (read-only)
        if: inputs.operation == 'monitor'
        run: python scripts/portfolio_sync.py --monitor
      - name: Inspect Telegram bot identity and webhook (read-only)
        if: inputs.operation == 'telegram'
        run: python scripts/portfolio_sync.py --telegram
      - name: Approved production synchronization and exact readback
        if: inputs.operation == 'write'
        run: python scripts/portfolio_sync.py --write
      - name: Failure notification
        if: failure()
        run: echo '::error::Portfolio operation failed. Check the safe error code above. Production quantities were not printed. GitHub Actions failure notifications must be enabled for the owner.'
