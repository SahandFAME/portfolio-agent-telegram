name: Weekly 18K gold portfolio history
on:
  schedule:
    # Saturday 00:30 Asia/Tehran, after the end of Friday.
    - cron: '0 21 * * 5'
  workflow_dispatch:
    inputs:
      action:
        description: History operation
        type: choice
        options: [export, bootstrap, backfill, capture]
        default: export
permissions:
  contents: read
  checks: write
concurrency:
  group: ${{ inputs.action == 'export' && 'portfolio-gold-export' || 'microsoft-consent' }}
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-sync.txt
      - name: Verify history math and workbook export
        run: python -m unittest discover -s tests -p 'test_gold_history.py'
      - name: Record and export private history
        env:
          HISTORY_ACTION: ${{ inputs.action || 'capture' }}
          MS_GRAPH_CLIENT_ID: 04a73ec3-340a-4cb6-a087-7fdc4dfd93e0
          MS_GRAPH_TENANT_ID: consumers
          MS_GRAPH_AUTH_MODE: delegated
          MS_GRAPH_DRIVE_ID: daef687b3c624f3
          MS_GRAPH_ITEM_ID: DAEF687B3C624F3!2063
          MS_GRAPH_REFRESH_TOKEN: ${{ secrets.MS_GRAPH_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.PORTFOLIO_SECRET_WRITER_TOKEN }}
          PORTFOLIO_SYNC_SECRET_AGENT: ${{ secrets.PORTFOLIO_SYNC_SECRET_AGENT }}
        run: python scripts/gold_history.py > gold-history-result.json
      - name: Publish aggregate history run outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import json,os,subprocess
          from pathlib import Path
          path=Path('gold-history-result.json')
          result=json.loads(path.read_text()) if path.exists() and path.stat().st_size else {'ok':False,'error':'history_worker_not_completed'}
          allowed={'ok','error','weeks','complete_weeks','observations','complete_observations','excel_stored','unmapped_trade_tables','unreconciled_assets'}
          result={k:v for k,v in result.items() if k in allowed}
          body={'name':'Portfolio gold history result','head_sha':os.environ['GITHUB_SHA'],'status':'completed',
            'conclusion':'success' if result.get('ok') else 'failure',
            'output':{'title':'History processing outcome (coverage is not a claim of complete valuation)','summary':json.dumps(result)}}
          run=subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",'--input','-'],input=json.dumps(body),capture_output=True,text=True)
          if run.returncode:raise SystemExit('Unable to publish aggregate history outcome')
          PYTHON
